<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Donor Home</title>
    <link rel="stylesheet" href="../css/home_page.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
          <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css"/>

<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

<script src="../js/search.js" defer></script>


          


</head>
<body>

    <!-- Navigation Bar -->
    <nav>

        <!-- Search Form -->
        <form action="#" method="get">

            <select name="blood_group" id="blood_group" >
                <option value="">Blood Group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="Other">Other</option>
            </select>
            <input type="search" id="city" name="place" placeholder="Enter Place name">

            <button type="submit">
                <i class="fa fa-search"></i> Search
            </button>

        </form>

        <!-- Statistics -->
        <div class="count">
            <div class="total_donors">
                <strong>Total Donors:</strong>
                <span id="donor_count">0</span>
            </div>

            <div class="available_blood_units">
                <strong>Available Blood Units:</strong>
                <span id="blood_unit_count">0</span>
            </div>
        </div>

        <!-- Auth Links -->
        <div class="signinOrsignup">
            <a href="signup.html">Signup</a>
            <span> | </span>
            <a href="signin.html">Signin</a>
        </div>

        <!-- Profile -->
        <div class="profile">
            <i class="fa fa-user"></i>
            <a href="profile.html">Profile</a>
        </div>

    </nav>

    <!-- Main Section -->
    <main>

        <h2>Nearby Blood Donors</h2>

        <!-- Google Map -->
        <section>
    <div id="map" tabindex="0"></div>
    <button id="locateBtn" title="My Location"></button>

</section>


        <!-- Donor List Placeholder -->
        <section>
            <h3>Available Donors</h3>

            <p>
                Donor results will appear here based on selected
                <strong>blood group</strong> and <strong>city</strong>.
            </p>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>
            © 2025 Blood Donor Management System |
            Save Life. Donate Blood.
        </p>
    </footer>


</body>
</html>
