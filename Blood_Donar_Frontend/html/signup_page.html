<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/signup.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src='https://kit.fontawesome.com/a076d05399.js' crossorigin='anonymous'></script>
    <script src="../js/signup.js" defer></script>
</head>

<body>

    <div class="container">

        <aside class="aside_quote">
            <h1>Welcome!</h1>
            <i class='fas fa-hand-holding-heart'></i>

            <p class="quote">
                “A few minutes of your time can give someone a lifetime.”
            </p>
        </aside>


        <!-- Right Side Form -->
        <section class="form_section">
            <h2>Create Account</h2>

            <form id="signupForm">

                <div class="input-group">
                    <i class="fa fa-user"></i>
                    <input type="text" name="name" placeholder="Full Name" required>
                </div>

                <div class="input-group">
                    <i class="fa fa-droplet"></i>
                    <select name="bloodGroup" id="bloodGroup" required>
                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="input-group" id="blood_name_div">
                    <i class="fa fa-droplet"></i>
                    <input type="text" name="blood_group_name" placeholder="Enter Blood Group" id="blood_name">
                </div>
                <div class="input-group">
                    <i class="fa fa-envelope"></i>
                    <input type="email" name="email" placeholder="Email Address" required>
                </div>

                <div class="input-group">
                    <i class="fa fa-phone"></i>
                    <input type="tel" name="mobile" placeholder="Mobile Number" required>
                </div>

                <div class="input-group">
                    <i class="fa fa-calendar"></i>
                    <input type="date" name="dob" required>
                </div>


                <div class="input-group">
                    <i class="fa fa-eye toggle-password" data-target="password"></i>
                    <input type="password" name="password" id="password" placeholder="Password" required>
                </div>

                <div class="input-group">
                    <i class="fa fa-eye toggle-password" data-target="confirmPassword"></i>
                    <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Confirm Password"
                        required>
                </div>


                <button type="submit" class="btn">Sign Up</button>

                <p class="login-text">
                    Already have an account? <a href="#">Login</a>
                </p>

            </form>
        </section>

    </div>


</body>

</html>
