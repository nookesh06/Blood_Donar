<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/login_page.css">
    <script src="../js/login.js" defer></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="container">

        <!-- Left Side -->
        <aside class="aside_quote">
            <h1>Welcome Back!</h1>
            <i class="fas fa-heartbeat"></i>
            <p class="quote">
                “Your contribution can save lives. Log in and continue the mission.”
            </p>
        </aside>

        <!-- Right Side -->
        <section class="form_section">
            <h2>SignIn</h2>

            <form id="loginForm">

                <div class="input-group">
                    <i class="fa fa-user"></i>
                    <input type="text" id="loginEmail" placeholder="Username or Email" required>
                </div>

                <div class="input-group password-group">
                    <i class="fa fa-eye toggle-password" data-target="loginPassword"></i>
                    <input type="password" id="loginPassword" placeholder="Password" required>
                </div>

                <button type="submit" class="btn">Sign In</button>
            </form>

        </section>

    </div>

    <script>
        document.querySelector(".toggle-password").addEventListener("click", function () {
            const input = document.getElementById("loginPassword");

            if (input.type === "password") {
                input.type = "text";
                this.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                input.type = "password";
                this.classList.replace("fa-eye-slash", "fa-eye");
            }
        });
    </script>

</body>

</html>
